<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка нейроголоса</title><style>body{font:16px system-ui;background:#101321;color:white;max-width:650px;margin:auto;padding:22px}section{background:#1a2034;padding:20px;border-radius:18px}button{padding:14px;border:0;border-radius:12px;background:#7757ed;color:white;font:inherit;width:100%}p{line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222a43;padding:12px;border-radius:10px}</style><h1>🎙️ Нейроголос: диагностика iPhone</h1><section><p>Проверка совместимости WebGPU перед интеграцией VocoLoco/OmniVoice. Эта страница не загружает модель и не генерирует голос.</p><button id="check">Проверить мой iPhone</button><pre id="out">Проверка ещё не запущена.</pre></section><script>document.getElementById("check").onclick=async()=>{const out=document.getElementById("out");out.textContent="Проверяю…";try{if(!navigator.gpu){out.textContent="❌ WebGPU недоступен в этом браузере. Попробуй Safari на iOS 26.";return}const adapter=await navigator.gpu.requestAdapter({powerPreference:"high-performance"});if(!adapter){out.textContent="❌ WebGPU адаптер не найден.";return}const f16=adapter.features.has("shader-f16");const lim=adapter.limits;out.textContent=(f16?"✅":"⚠️")+" WebGPU: доступен\n"+(f16?"✅":"❌")+" shader-f16: "+(f16?"поддерживается":"не поддерживается")+"\nmaxBufferSize: "+Math.round(lim.maxBufferSize/1048576)+" МБ\nmaxStorageBufferBindingSize: "+Math.round(lim.maxStorageBufferBindingSize/1048576)+" МБ\n"+(f16?"Можно переходить к тестированию движка OmniVoice. Это ещё не подтверждает, что модель поместится в память.":"Этот браузер не подходит для WebGPU-движка OmniVoice.");}catch(e){out.textContent="Ошибка проверки: "+e.message}};</script></html>
