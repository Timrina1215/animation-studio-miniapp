<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка нейроголоса</title><style>body{font:16px system-ui;background:#101321;color:white;max-width:650px;margin:auto;padding:22px}section{background:#1a2034;padding:20px;border-radius:18px}button{padding:14px;border:0;border-radius:12px;background:#7757ed;color:white;font:inherit;width:100%}p{line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222a43;padding:12px;border-radius:10px}</style><h1>🎙️ Нейроголос: диагностика iPhone</h1><section><p>Проверка совместимости WebGPU перед интеграцией VocoLoco/OmniVoice. Эта страница не загружает модель и не генерирует голос.</p><button id="check">Проверить мой iPhone</button><button id="model" style="margin-top:12px;background:#34456d">Проверить доступ к модели и движку</button><pre id="modelOut">Загрузка модели не запускалась.</pre><pre id="out">Проверка ещё не запущена.</pre></section><script>document.getElementById("check").onclick=async()=>{const out=document.getElementById("out");out.textContent="Проверяю…";try{if(!navigator.gpu){out.textContent="❌ WebGPU недоступен в этом браузере. Попробуй Safari на iOS 26.";return}const adapter=await navigator.gpu.requestAdapter({powerPreference:"high-performance"});if(!adapter){out.textContent="❌ WebGPU адаптер не найден.";return}const f16=adapter.features.has("shader-f16");const lim=adapter.limits;out.textContent=(f16?"✅":"⚠️")+" WebGPU: доступен\n"+(f16?"✅":"❌")+" shader-f16: "+(f16?"поддерживается":"не поддерживается")+"\nmaxBufferSize: "+Math.round(lim.maxBufferSize/1048576)+" МБ\nmaxStorageBufferBindingSize: "+Math.round(lim.maxStorageBufferBindingSize/1048576)+" МБ\n"+(f16?"Можно переходить к тестированию движка OmniVoice. Это ещё не подтверждает, что модель поместится в память.":"Этот браузер не подходит для WebGPU-движка OmniVoice.");}catch(e){out.textContent="Ошибка проверки: "+e.message}};document.getElementById("model").onclick=async()=>{
const out=document.getElementById("modelOut");out.textContent="Проверяю источники по отдельности…";
const base="https://huggingface.co/Gigsu/vocoloco-onnx/resolve/main";
const tests=[
["Манифест OmniVoice",base+"/engine/omnivoice-f16.json","json"],
["Манифест декодера",base+"/engine/decoder-f32.json","json"],
["Манифест OmniVoice (альтернативный домен)","https://hf-mirror.com/Gigsu/vocoloco-onnx/resolve/main/engine/omnivoice-f16.json","json"],
["Манифест декодера (альтернативный домен)","https://hf-mirror.com/Gigsu/vocoloco-onnx/resolve/main/engine/decoder-f32.json","json"],
["Модуль движка (CDN)","https://cdn.jsdelivr.net/npm/@vocoloco/engine@0.1.0/omnivoice-engine.js","module"]
];
for(const [name,url,type] of tests){
out.textContent+="\n⏳ "+name;
try{
if(type==="module"){const mod=await import(url);if(typeof mod.OmniVoiceEngine!=="function")throw Error("Нет OmniVoiceEngine")}
else{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{signal:controller.signal,cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();if(!data||typeof data!=="object")throw Error("Неверный JSON")}finally{clearTimeout(timeout)}}
out.textContent+="\n✅ "+name+": доступен";
}catch(e){out.textContent+="\n❌ "+name+": "+(e.name||"Error")+" - "+e.message+"\nАдрес: "+url}
}
out.textContent+="\n\nДиагностика завершена. Большие веса модели не скачивались.";
};</script></html>
