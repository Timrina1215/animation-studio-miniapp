<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation Studio - проверка нейродвижка</title><style>body{font:16px system-ui;background:#101321;color:white;max-width:680px;margin:auto;padding:20px}section{background:#1a2034;border-radius:16px;padding:18px;margin:14px 0}button{background:#7757ed;color:white;border:0;border-radius:12px;padding:13px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d1eb}a{color:#c5b8ff}</style><h1>🎙️ Нейродвижок - проверка</h1><p>Проверка технических условий для встроенной генерации речи. Эта страница пока не создаёт звук и не загружает гигабайты модели.</p><section><button id="check">Проверить мой iPhone</button><pre id="out">Проверка ещё не запускалась.</pre></section><a href="./index.html">← Вернуться в Animation Studio</a><script>
const out=document.querySelector('#out'),button=document.querySelector('#check');button.onclick=async()=>{button.disabled=true;const log=x=>out.textContent+='\n'+x;out.textContent='Проверка WebGPU...';try{if(!navigator.gpu)throw Error('WebGPU недоступен');const a=await navigator.gpu.requestAdapter();if(!a)throw Error('Нет GPU-адаптера');log('✓ WebGPU доступен');log((a.features.has('shader-f16')?'✓':'✕')+' shader-f16');log('maxBufferSize: '+Math.round(a.limits.maxBufferSize/1048576)+' МБ');const d=await a.requestDevice({requiredFeatures:a.features.has('shader-f16')?['shader-f16']:[]});log('✓ GPU устройство создано');d.destroy()}catch(e){log('Ошибка GPU: '+e.message)}log('Проверка доступности манифеста модели (без загрузки весов)...');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch('https://huggingface.co/Gigsu/vocoloco-onnx/resolve/main/engine/omnivoice-f16.json',{signal:controller.signal});log('HTTP '+r.status+'; CORS доступ: '+(r.ok?'да':'нет'));if(r.ok){const j=await r.json();log('✓ Манифест прочитан: '+Object.keys(j).slice(0,8).join(', '))}}catch(e){log('Манифест недоступен: '+e.message)}finally{clearTimeout(timer)}log('Готово. Это диагностика, а не генерация речи.');button.disabled=false};
</script></html>
