<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Animation Studio</title>
<style>body{margin:0;background:#101321;color:#fff;font:15px system-ui}main{max-width:720px;margin:auto;padding:18px}h1{margin:8px 0}button,input,textarea,select{font:inherit;border:1px solid #3c4260;border-radius:12px;background:#222a43;color:white;padding:11px;box-sizing:border-box}button{cursor:pointer}button.primary{background:#7757ed;border:0}textarea{width:100%;height:110px}canvas{width:100%;aspect-ratio:9/12;border-radius:18px;background:#f7f1e6}section{background:#1a2034;padding:15px;border-radius:16px;margin:12px 0}label{display:block;margin:9px 0 4px}select,input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#bac3dd;font-size:13px}button.active{background:#7757ed}#status{min-height:20px}</style>
<main><h1>🎬 Animation Studio</h1><p class="muted">2D-конструктор • работает в браузере и Telegram</p><div class="row"><button id="autoBtn" class="active">✨ Автоматически</button><button id="manualBtn">🎬 Режиссёр</button></div>
<section id="auto"><label>Сценарий (одна строка - одна сцена)</label><textarea id="script">Однажды маленький человечек отправился на прогулку.
Он шёл по дороге и радовался прекрасному дню.
Вдруг он увидел своего друга и помахал ему рукой.
Потом он сел на стул и решил немного отдохнуть.</textarea><button class="primary" id="build">Создать сцены</button></section>
<section id="manual" hidden><label>Сцена</label><select id="scene"></select><label>Действие</label><select id="action"><option value="walk">Идёт</option><option value="wave">Машет</option><option value="sit">Сидит</option><option value="talk">Говорит</option></select><label>Фон</label><select id="bg"><option value="park">Парк</option><option value="room">Комната</option><option value="night">Ночь</option></select><label>Цвет одежды</label><input type="color" id="shirt" value="#6d87c7"><label>Длительность сцены, сек</label><input id="seconds" type="number" min="1" max="20" value="4"><button id="apply">Применить</button></section>
<section id="character"><h2 style="margin:0 0 8px">🎨 Персонаж</h2><p class="muted">Настрой внешность героя для всех сцен</p><div class="row"><div><label>Тип персонажа</label><select id="bodyType"><option value="f">Женский</option><option value="m">Мужской</option></select></div><div><label>Причёска</label><select id="hairStyle"><option value="long">Длинные волосы</option><option value="bob">Каре</option><option value="short">Короткие</option><option value="bun">Пучок</option></select></div></div><div class="row"><div><label>Цвет волос</label><input id="hairColor" type="color" value="#79513c"></div><div><label>Тон кожи</label><input id="skinColor" type="color" value="#edbd9c"></div><div><label>Цвет глаз</label><input id="eyeColor" type="color" value="#537e9a"></div></div><div class="row"><div><label>Эмоция</label><select id="emotion"><option value="happy">Улыбка</option><option value="calm">Спокойствие</option><option value="sad">Грусть</option><option value="surprised">Удивление</option></select></div><div><label>Одежда</label><input id="outfitColor" type="color" value="#9d73bb"></div></div><button id="characterApply" class="primary">Применить внешность</button></section><canvas id="stage" width="480" height="640"></canvas><section><div class="row"><button class="primary" id="play">▶ Смотреть</button><button id="stop">■ Стоп</button><button id="save">💾 Сохранить</button></div><p id="status" class="muted">Готово к просмотру</p></section></main>
<script>
const $=id=>document.getElementById(id),c=$("stage"),g=c.getContext("2d");
let scenes=[],current=0,playing=false,started=0,frame=0,mode="auto";
let character={bodyType:"f",hairStyle:"long",hairColor:"#79513c",skinColor:"#edbd9c",eyeColor:"#537e9a",emotion:"happy",outfitColor:"#9d73bb"};
const defaults={action:"talk",bg:"park",shirt:"#6d87c7",seconds:4};
function guess(s){s=s.toLowerCase();return /помах|привет|машет|wave/.test(s)?"wave":/сел|сид|стул|sit/.test(s)?"sit":/шёл|шел|идёт|идет|гуля|walk/.test(s)?"walk":"talk"}
function build(){scenes=$("script").value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,12).map(text=>({...defaults,text,action:guess(text)}));if(!scenes.length)scenes=[{...defaults,text:"Новая сцена"}];current=0;refresh();draw(0);$("status").textContent="Создано сцен: "+scenes.length}
function refresh(){$("scene").innerHTML=scenes.map((s,i)=>'<option value="'+i+'">Сцена '+(i+1)+'</option>').join("");$("scene").value=current;let s=scenes[current];for(let k of ["action","bg","shirt","seconds"])$(k).value=s[k]}
function apply(){let s=scenes[current];for(let k of ["action","bg","shirt","seconds"])s[k]=$(k).value;s.seconds=Math.min(20,Math.max(1,Number(s.seconds)||4));draw(0)}
function modeSet(m){mode=m;$("auto").hidden=m!=="auto";$("manual").hidden=m!=="manual";$("autoBtn").classList.toggle("active",m==="auto");$("manualBtn").classList.toggle("active",m==="manual")}
function shape(points,color,stroke){g.beginPath();g.moveTo(...points[0]);for(const p of points.slice(1))g.lineTo(...p);g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function ellipse(x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill()}
function limb(a,b,c,d,w,color){g.strokeStyle=color;g.lineWidth=w;g.lineCap="round";g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function backdrop(s){let sky=g.createLinearGradient(0,0,0,640);if(s.bg==="night"){sky.addColorStop(0,"#1b284b");sky.addColorStop(1,"#5a658c")}else if(s.bg==="room"){sky.addColorStop(0,"#f1e5d8");sky.addColorStop(1,"#e7cbb3")}else{sky.addColorStop(0,"#94d5e8");sky.addColorStop(1,"#f6e5c8")}g.fillStyle=sky;g.fillRect(0,0,480,640);
if(s.bg==="room"){g.fillStyle="#cda989";g.fillRect(0,444,480,196);g.fillStyle="#faf2dc";g.fillRect(40,155,150,175);g.fillStyle="#9ac6d7";g.fillRect(51,166,128,153);g.fillStyle="#fff";g.fillRect(108,166,10,153);g.fillRect(51,236,128,10);g.fillStyle="#a47d67";g.fillRect(0,440,480,9)}else{g.fillStyle=s.bg==="night"?"#384f62":"#8ab99b";g.beginPath();g.ellipse(240,505,360,110,0,0,7);g.fill();g.fillStyle=s.bg==="night"?"#455e62":"#b2d39c";g.fillRect(0,500,480,140);for(let x of [55,420]){g.fillStyle="#795f52";g.fillRect(x-8,355,16,145);for(let j=0;j<3;j++)ellipse(x+(j-1)*15,350+j*13,40,50,s.bg==="night"?"#34546a":"#5d9d7e")}ellipse(400,105,29,29,s.bg==="night"?"#fff2cb":"#ffdc86")}
}
function characterDraw(s,t){const C=character,walking=s.action==="walk",sitting=s.action==="sit",waving=s.action==="wave",moving=walking?Math.sin(t*7):0;let x=240+(walking?Math.sin(t*0.9)*60:0),y=sitting?390:385+(walking?Math.abs(moving)*5:Math.sin(t*2)*2);
g.save();g.translate(x,y);g.scale(1.18,1.18);
ellipse(0,89,45,9,"#46565b33");
const cloth=C.outfitColor||s.shirt||"#9d73bb",skin=C.skinColor||"#edbd9c",hair=C.hairColor||"#79513c";
if(sitting){g.fillStyle="#85695d";g.fillRect(-54,60,108,12);g.fillRect(-45,72,9,60);g.fillRect(35,72,9,60)}
limb(-15,44,-25+(walking?moving*19:-25),sitting?73:126,15,"#353b5a");limb(15,44,25-(walking?moving*19:-25),sitting?73:126,15,"#353b5a");
if(sitting){limb(-25,73,-30,120,13,"#353b5a");limb(25,73,30,120,13,"#353b5a")}
ellipse(-25+(walking?moving*19:0),sitting?123:129,16,7,"#322e3c");ellipse(25-(walking?moving*19:0),sitting?123:129,16,7,"#322e3c");
if(C.bodyType==="f")shape([[-19,-20],[19,-20],[26,27],[38,61],[-38,61],[-26,27]],cloth);else shape([[-25,-20],[25,-20],[23,53],[-23,53]],cloth);
limb(-22,-10,-43,37+(walking?moving*13:0),13,skin);limb(22,-10,44+(waving?Math.sin(t*8)*14:0),waving?-65:37-(walking?moving*13:0),13,skin);
ellipse(-43,37+(walking?moving*13:0),7,8,skin);ellipse(44+(waving?Math.sin(t*8)*14:0),waving?-65:37-(walking?moving*13:0),7,8,skin);
ellipse(0,-30,10,18,skin);
if(["long","bob","bun"].includes(C.hairStyle)){ellipse(0,-96,42,C.hairStyle==="long"?72:50,hair);if(C.hairStyle==="bun")ellipse(30,-139,22,22,hair)}
ellipse(0,-90,36,45,skin);
ellipse(0,-124,37,22,hair);
if(C.hairStyle==="short"){ellipse(-26,-121,16,20,hair);ellipse(23,-123,17,20,hair)}
if(C.hairStyle==="long"){ellipse(-35,-89,12,52,hair);ellipse(35,-89,12,52,hair)}
ellipse(-13,-93,7,5,"#fff");ellipse(13,-93,7,5,"#fff");ellipse(-12,-93,4,4,C.eyeColor);ellipse(14,-93,4,4,C.eyeColor);ellipse(-11,-94,1.5,1.5,"#161b25");ellipse(15,-94,1.5,1.5,"#161b25");ellipse(0,-80,3,5,"#ce9c82");
g.beginPath();g.strokeStyle="#8c4b55";g.lineWidth=2.8;if(C.emotion==="surprised"){ellipse(0,-69,6,8,"#874c50")}else if(C.emotion==="sad"){g.arc(0,-60,12,Math.PI*1.12,Math.PI*1.88,true);g.stroke()}else if(C.emotion==="calm"){limb(-9,-67,9,-67,2,"#8c4b55")}else{g.arc(0,-72,12,0.1,Math.PI-0.1);g.stroke()}
if(s.action==="talk"&&Math.sin(t*10)>0.2)ellipse(0,-66,5,7,"#8c4b55");
g.restore()}
function draw(t){let s=scenes[current];if(!s)return;backdrop(s);characterDraw(s,t);g.fillStyle="#ffffffed";g.beginPath();g.roundRect(16,16,448,102,12);g.fill();g.fillStyle="#252b42";g.font="17px system-ui";let words=s.text.split(" "),lines=[""];for(let word of words){let i=lines.length-1;if(g.measureText(lines[i]+" "+word).width>417)lines.push(word);else lines[i]+=(lines[i]?" ":"")+word}lines.slice(0,4).forEach((v,i)=>g.fillText(v,28,43+i*21));g.fillStyle="#fff";g.font="14px system-ui";g.fillText((current+1)+"/"+scenes.length,20,618)}
function tick(now){if(!playing)return;let elapsed=(now-started)/1000,s=scenes[current];if(elapsed>=s.seconds){current++;if(current>=scenes.length){playing=false;current=0;refresh();draw(0);$("status").textContent="Просмотр завершён";return}started=now;refresh();elapsed=0}draw(elapsed);frame=requestAnimationFrame(tick)}
$("autoBtn").onclick=()=>modeSet("auto");$("manualBtn").onclick=()=>modeSet("manual");$("build").onclick=build;$("apply").onclick=apply;$("scene").onchange=()=>{current=Number($("scene").value);refresh();draw(0)};$("play").onclick=()=>{if(playing)return;playing=true;current=0;refresh();started=performance.now();frame=requestAnimationFrame(tick);$("status").textContent="Идёт просмотр"};$("stop").onclick=()=>{playing=false;cancelAnimationFrame(frame);$("status").textContent="Остановлено"};$("save").onclick=()=>{localStorage.setItem("animation-studio-v1",JSON.stringify({scenes,script:$("script").value,character}));$("status").textContent="Проект сохранён на этом устройстве"};try{let old=JSON.parse(localStorage.getItem("animation-studio-v1"));if(old&&old.scenes?.length){scenes=old.scenes;if(old.character)character={...character,...old.character};$("script").value=old.script||"";refresh();draw(0)}else build()}catch(e){build()}
for(let k of Object.keys(character))$(k).value=character[k];$("characterApply").onclick=()=>{for(let k of Object.keys(character))character[k]=$(k).value;draw(0);$("status").textContent="Внешность персонажа обновлена"};
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script></html>
