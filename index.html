<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Animation Studio</title>
<style>body{margin:0;background:#101321;color:#fff;font:15px system-ui}main{max-width:720px;margin:auto;padding:18px}h1{margin:8px 0}button,input,textarea,select{font:inherit;border:1px solid #3c4260;border-radius:12px;background:#222a43;color:white;padding:11px;box-sizing:border-box}button{cursor:pointer}button.primary{background:#7757ed;border:0}textarea{width:100%;height:110px}canvas{width:100%;aspect-ratio:9/12;border-radius:18px;background:#f7f1e6}section{background:#1a2034;padding:15px;border-radius:16px;margin:12px 0}label{display:block;margin:9px 0 4px}select,input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#bac3dd;font-size:13px}button.active{background:#7757ed}#status{min-height:20px}</style>
<main><h1>🎬 Animation Studio</h1><p class="muted">2D-конструктор • работает в браузере и Telegram</p><div class="row"><button id="autoBtn" class="active">✨ Автоматически</button><button id="manualBtn">🎬 Режиссёр</button></div>
<section id="auto"><label>Сценарий (одна строка - одна сцена)</label><textarea id="script">Однажды маленький человечек отправился на прогулку.
Он шёл по дороге и радовался прекрасному дню.
Вдруг он увидел своего друга и помахал ему рукой.
Потом он сел на стул и решил немного отдохнуть.</textarea><button class="primary" id="build">Создать сцены</button></section>
<section id="manual" hidden><label>Сцена</label><select id="scene"></select><label>Действие</label><select id="action"><option value="walk">Идёт</option><option value="wave">Машет</option><option value="sit">Сидит</option><option value="talk">Говорит</option></select><label>Фон</label><select id="bg"><option value="park">Парк</option><option value="room">Комната</option><option value="night">Ночь</option></select><label>Цвет одежды</label><input type="color" id="shirt" value="#6d87c7"><label>Длительность сцены, сек</label><input id="seconds" type="number" min="1" max="20" value="4"><button id="apply">Применить</button></section>
<canvas id="stage" width="480" height="640"></canvas><section><div class="row"><button class="primary" id="play">▶ Смотреть</button><button id="stop">■ Стоп</button><button id="save">💾 Сохранить</button></div><p id="status" class="muted">Готово к просмотру</p></section></main>
<script>
const $=id=>document.getElementById(id),c=$("stage"),g=c.getContext("2d");
let scenes=[],current=0,playing=false,started=0,frame=0,mode="auto";
const defaults={action:"talk",bg:"park",shirt:"#6d87c7",seconds:4};
function guess(s){s=s.toLowerCase();return /помах|привет|машет|wave/.test(s)?"wave":/сел|сид|стул|sit/.test(s)?"sit":/шёл|шел|идёт|идет|гуля|walk/.test(s)?"walk":"talk"}
function build(){scenes=$("script").value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,12).map(text=>({...defaults,text,action:guess(text)}));if(!scenes.length)scenes=[{...defaults,text:"Новая сцена"}];current=0;refresh();draw(0);$("status").textContent="Создано сцен: "+scenes.length}
function refresh(){$("scene").innerHTML=scenes.map((s,i)=>'<option value="'+i+'">Сцена '+(i+1)+'</option>').join("");$("scene").value=current;let s=scenes[current];for(let k of ["action","bg","shirt","seconds"])$(k).value=s[k]}
function apply(){let s=scenes[current];for(let k of ["action","bg","shirt","seconds"])s[k]=$(k).value;s.seconds=Math.min(20,Math.max(1,Number(s.seconds)||4));draw(0)}
function modeSet(m){mode=m;$("auto").hidden=m!=="auto";$("manual").hidden=m!=="manual";$("autoBtn").classList.toggle("active",m==="auto");$("manualBtn").classList.toggle("active",m==="manual")}
function line(x,y,X,Y,w=5){g.lineWidth=w;g.lineCap="round";g.strokeStyle="#303346";g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function draw(t){let s=scenes[current];if(!s)return;g.fillStyle=s.bg==="night"?"#263451":s.bg==="room"?"#e8d9ce":"#cbe9ef";g.fillRect(0,0,480,640);g.fillStyle=s.bg==="night"?"#394c68":s.bg==="room"?"#bfa899":"#b9d7a4";g.fillRect(0,450,480,190);if(s.bg==="park"){g.fillStyle="#78a56d";for(let x of [55,420]){g.fillRect(x-5,320,10,130);g.beginPath();g.arc(x,320,40,0,7);g.fill()}}if(s.bg==="room"){g.fillStyle="#b78d68";g.fillRect(30,110,120,150);g.fillStyle="#d4e7f7";g.fillRect(40,120,100,130)}if(s.bg==="night"){g.fillStyle="#fff3b6";g.beginPath();g.arc(400,85,28,0,7);g.fill()}
let x=240+(s.action==="walk"?Math.sin(t*1.3)*75:0),y=320+(s.action==="walk"?Math.sin(t*9)*5:0)+(s.action==="sit"?30:0),swing=Math.sin(t*9)*26;
g.fillStyle="#f2c4a2";g.beginPath();g.arc(x,y-53,29,0,7);g.fill();g.strokeStyle="#303346";g.lineWidth=3;g.stroke();g.fillStyle="#332a2b";g.beginPath();g.arc(x-10,y-58,2.8,0,7);g.arc(x+10,y-58,2.8,0,7);g.fill();g.beginPath();g.ellipse(x,y-40,6,s.action==="talk"?2+Math.abs(Math.sin(t*8))*6:3,0,0,7);g.stroke();g.fillStyle=s.shirt;g.fillRect(x-20,y-21,40,82);
line(x-16,y,x-42,y+55+(s.action==="walk"?swing:0));line(x+16,y,x+43+(s.action==="wave"?Math.sin(t*8)*16:0),s.action==="wave"?y-58:y+55-(s.action==="walk"?swing:0));
if(s.action==="sit"){line(x-12,y+61,x-47,y+75);line(x-47,y+75,x-47,450);line(x+12,y+61,x+47,y+75);line(x+47,y+75,x+47,450);line(x-55,y+72,x+60,y+72,4)}else{line(x-10,y+61,x-27+(s.action==="walk"?swing:0),450);line(x+10,y+61,x+27-(s.action==="walk"?swing:0),450)}
g.fillStyle="#fff";g.fillRect(15,16,450,95);g.fillStyle="#20243a";g.font="17px system-ui";let words=s.text.split(" "),lines=[""];for(let word of words){let i=lines.length-1;if(g.measureText(lines[i]+" "+word).width>420)lines.push(word);else lines[i]+=(lines[i]?" ":"")+word}lines.slice(0,4).forEach((v,i)=>g.fillText(v,27,43+i*22));g.fillStyle="#fff";g.font="14px system-ui";g.fillText((current+1)+"/"+scenes.length,20,615)}
function tick(now){if(!playing)return;let elapsed=(now-started)/1000,s=scenes[current];if(elapsed>=s.seconds){current++;if(current>=scenes.length){playing=false;current=0;refresh();draw(0);$("status").textContent="Просмотр завершён";return}started=now;refresh();elapsed=0}draw(elapsed);frame=requestAnimationFrame(tick)}
$("autoBtn").onclick=()=>modeSet("auto");$("manualBtn").onclick=()=>modeSet("manual");$("build").onclick=build;$("apply").onclick=apply;$("scene").onchange=()=>{current=Number($("scene").value);refresh();draw(0)};$("play").onclick=()=>{if(playing)return;playing=true;current=0;refresh();started=performance.now();frame=requestAnimationFrame(tick);$("status").textContent="Идёт просмотр"};$("stop").onclick=()=>{playing=false;cancelAnimationFrame(frame);$("status").textContent="Остановлено"};$("save").onclick=()=>{localStorage.setItem("animation-studio-v1",JSON.stringify({scenes,script:$("script").value}));$("status").textContent="Проект сохранён на этом устройстве"};try{let old=JSON.parse(localStorage.getItem("animation-studio-v1"));if(old&&old.scenes?.length){scenes=old.scenes;$("script").value=old.script||"";refresh();draw(0)}else build()}catch(e){build()}
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script></html>
